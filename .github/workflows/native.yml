name: PDF native packages and compatibility checks
on:
  pull_request:
  push:
    branches: [main, 'feat/native-pdf-*', feat/pdf-hybrid-retrieval]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web-and-project-coverage:
    # The Node 24 matrix below proves platform packaging. This lane also
    # exercises the real DSH Web composition and all project-owned source.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: dsh-bundle-pdf
      - uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          # Keep the adjacent test host reproducible; bump deliberately when
          # adopting a new DSH contract.
          ref: d02ea370ee15556a643207eeb21810c29ca8c437
          path: deepseek-harness
      - uses: actions/setup-node@v4
        with:
          node-version: 26.7.0
      - name: Prepare pinned DSH test host
        working-directory: deepseek-harness
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm run build:artifacts
      - name: Install PDF bundle and pinned native SDK
        working-directory: dsh-bundle-pdf
        run: |
          npm ci
          npm run native:build
      # Playwright's Chromium install stalls after download under Node 26 on
      # this runner. Use the LTS CLI runtime, then restore Node 26 for coverage.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Chromium with system dependencies
        working-directory: dsh-bundle-pdf
        timeout-minutes: 10
        run: npx playwright install --with-deps chromium
      - uses: actions/setup-node@v4
        with:
          node-version: 26.7.0
      - name: Browser interaction tests
        working-directory: dsh-bundle-pdf
        env:
          DSH_SNAPSHOT: replay
          DSH_PDF_REQUIRE_NATIVE_TESTS: '1'
        run: npm run test:web
      - name: Install LLVM tools for native coverage
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes clang llvm
          clang++ --version
          llvm-profdata --version
      - name: Node, browser, and native project coverage
        working-directory: dsh-bundle-pdf
        env:
          DSH_SNAPSHOT: replay
          DSH_PDF_REQUIRE_NATIVE_TESTS: '1'
        run: npm run test:coverage:project
      - name: Upload project coverage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dsh-pdf-project-coverage
          path: dsh-bundle-pdf/.test-output/project-coverage-*/
          if-no-files-found: warn
          include-hidden-files: true
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-24.04
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: darwin-x64
            runner: macos-15-intel
          - target: darwin-arm64
            runner: macos-15
          - target: win32-x64
            runner: windows-2022
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Configure Windows C++ compiler
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - run: npm ci
      - run: npm run native:build
      - run: npm run check
        env:
          DSH_PDF_REQUIRE_NATIVE_TESTS: '1'
      - name: Pack complete platform-specific npm package without build scripts
        run: npm pack --ignore-scripts
      - name: Verify and name installable npm package
        run: node scripts/package-native.mjs ${{ matrix.target }}
      - name: Upload installable npm package
        uses: actions/upload-artifact@v4
        with:
          name: dsh-pdf-npm-package-${{ matrix.target }}
          path: artifacts/*-${{ matrix.target }}-npm-package.tgz
          if-no-files-found: error
      - name: Reader smoke
        if: matrix.target == 'linux-x64'
        run: |
          npx playwright install --with-deps chromium
          npm run bench:browser -- --document text-1000 --repeats 1 --out bench-results/ci-native
      - name: Upload Linux reader smoke results
        uses: actions/upload-artifact@v4
        if: always() && matrix.target == 'linux-x64'
        with:
          name: native-reader-smoke
          path: bench-results/ci-native
