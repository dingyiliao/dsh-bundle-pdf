name: PDF native packages and compatibility checks
on:
  pull_request:
  push:
    branches: [main, 'feat/native-pdf-*', feat/pdf-hybrid-retrieval, 'feat/npm-*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified npm packages (requires configured npm trusted publishing)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  release-gate:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish))
    runs-on: ubuntu-24.04
    outputs:
      publish: ${{ steps.release.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Decide whether this commit requests a stable npm release
        id: release
        run: node scripts/release-gate.mjs
  web-and-project-coverage:
    # The Node 24 matrix below proves platform packaging. This lane also
    # exercises the real DSH Web composition and all project-owned source.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: dsh-bundle-pdf
      - uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          # Keep the adjacent test host reproducible; bump deliberately when
          # adopting a new DSH contract.
          ref: d02ea370ee15556a643207eeb21810c29ca8c437
          path: deepseek-harness
      - uses: actions/setup-node@v4
        with:
          node-version: 26.7.0
      - name: Prepare pinned DSH test host
        working-directory: deepseek-harness
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm run build:artifacts
      - name: Install PDF bundle and pinned native SDK
        working-directory: dsh-bundle-pdf
        run: |
          npm ci
          npm run native:build
      # Playwright's Chromium install stalls after download under Node 26 on
      # this runner. Use the LTS CLI runtime, then restore Node 26 for coverage.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Chromium with system dependencies
        working-directory: dsh-bundle-pdf
        timeout-minutes: 10
        run: npx playwright install --with-deps chromium
      - uses: actions/setup-node@v4
        with:
          node-version: 26.7.0
      - name: Browser interaction tests
        working-directory: dsh-bundle-pdf
        env:
          DSH_SNAPSHOT: replay
          DSH_PDF_REQUIRE_NATIVE_TESTS: '1'
        run: npm run test:web
      - name: Install LLVM tools for native coverage
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes clang llvm
          clang++ --version
          llvm-profdata --version
      - name: Node, browser, and native project coverage
        working-directory: dsh-bundle-pdf
        env:
          DSH_SNAPSHOT: replay
          DSH_PDF_REQUIRE_NATIVE_TESTS: '1'
        run: npm run test:coverage:project
      - name: Upload project coverage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dsh-pdf-project-coverage
          path: |
            dsh-bundle-pdf/.test-output/project-coverage-*/
            dsh-bundle-pdf/.test-output/web-tests-*/
          if-no-files-found: warn
          include-hidden-files: true
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-24.04
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: darwin-x64
            runner: macos-15-intel
          - target: darwin-arm64
            runner: macos-15
          - target: win32-x64
            runner: windows-2022
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Configure Windows C++ compiler
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - run: npm ci
      - run: npm run native:build
      - name: Check standalone Windows runtime dependencies
        if: matrix.target == 'win32-x64'
        shell: pwsh
        run: |
          foreach ($binary in @('dist/native/dsh-pdf-native.exe', 'dist/native/pdfium.dll')) {
            $dependencies = (& dumpbin /DEPENDENTS $binary | Out-String)
            if ($LASTEXITCODE -ne 0) { throw "Cannot inspect $binary" }
            Write-Output $dependencies
            if ($dependencies -match '(?im)^\s+(?:VCRUNTIME|MSVCP)\S*\.dll\s*$') {
              throw "$binary depends on an external Visual C++ runtime"
            }
          }
      - run: npm run check
        env:
          DSH_PDF_REQUIRE_NATIVE_TESTS: '1'
      - name: Pack and verify platform native dependency
        run: node scripts/package-native.mjs ${{ matrix.target }}
      - name: Pack and verify universal plugin
        run: node scripts/package-main.mjs
      - name: Install packed packages in a clean directory and run native and SDK smoke
        shell: bash
        run: node scripts/smoke-package-install.mjs --main artifacts/*-main.tgz --native artifacts/*-${{ matrix.target }}-native.tgz
      - name: Upload platform native package
        uses: actions/upload-artifact@v4
        with:
          name: dsh-pdf-native-${{ matrix.target }}
          path: artifacts/*-${{ matrix.target }}-native.tgz
          if-no-files-found: error
      - name: Reader smoke
        if: matrix.target == 'linux-x64'
        run: |
          npx playwright install --with-deps chromium
          npm run bench:browser -- --document text-1000 --repeats 1 --out bench-results/ci-native
      - name: Upload Linux reader smoke results
        uses: actions/upload-artifact@v4
        if: always() && matrix.target == 'linux-x64'
        with:
          name: native-reader-smoke
          path: bench-results/ci-native
  package-main:
    needs: [native, web-and-project-coverage]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run build
      - run: node scripts/package-main.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-pdf-main
          path: artifacts/*-main.tgz
          if-no-files-found: error
  publish:
    if: needs.release-gate.outputs.publish == 'true' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish))
    needs: [release-gate, native, web-and-project-coverage, package-main]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: npm-pdf-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install npm with trusted publishing support
        run: npm install --global npm@11.21.1
      - uses: actions/download-artifact@v4
        with:
          pattern: dsh-pdf-native-*
          path: artifacts
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: dsh-pdf-main
          path: artifacts
      - name: Skip a superseded release while holding the publishing lock
        id: current-release
        run: node scripts/release-gate.mjs --current-main
      - name: Publish matching native packages, then the plugin
        if: steps.current-release.outputs.publish == 'true'
        run: node scripts/publish-npm.mjs --artifacts artifacts
