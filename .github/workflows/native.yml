name: PDF native packages and compatibility checks
on:
  pull_request:
  push:
    branches: [main, 'feat/native-pdf-*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-24.04
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: darwin-x64
            runner: macos-15-intel
          - target: darwin-arm64
            runner: macos-15
          - target: win32-x64
            runner: windows-2022
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Configure Windows C++ compiler
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - run: npm ci
      - run: npm run native:build
      - run: npm run check
        env:
          DSH_PDF_REQUIRE_NATIVE_TESTS: '1'
      - name: Reader smoke
        if: matrix.target == 'linux-x64'
        run: |
          npx playwright install --with-deps chromium
          npm run bench:browser -- --engine native --document text-1000 --repeats 1 --out bench-results/ci-native
      - name: Pack complete platform-specific npm package without build scripts
        run: npm pack --ignore-scripts
      - name: Verify and name installable npm package
        run: node scripts/package-native.mjs ${{ matrix.target }}
      - name: Upload installable npm package
        uses: actions/upload-artifact@v4
        with:
          name: dsh-pdf-npm-package-${{ matrix.target }}
          path: artifacts/*-${{ matrix.target }}-npm-package.tgz
          if-no-files-found: error
      - name: Upload Linux reader smoke results
        uses: actions/upload-artifact@v4
        if: always() && matrix.target == 'linux-x64'
        with:
          name: native-reader-smoke
          path: bench-results/ci-native
