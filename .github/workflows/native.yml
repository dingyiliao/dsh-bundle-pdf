name: PDF native and compatibility checks
on:
  pull_request:
  push:
    branches: [main, 'feat/native-pdf-*']
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Configure Windows C++ compiler
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - run: npm ci
      - run: npm run native:build
      - run: npm run check
        env:
          DSH_PDF_REQUIRE_NATIVE_TESTS: '1'
      - name: Reader smoke
        if: runner.os == 'Linux'
        run: |
          npx playwright install --with-deps chromium
          npm run bench:browser -- --engine native --document text-1000 --repeats 1 --out bench-results/ci-native
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Linux'
        with:
          name: native-reader-smoke
          path: bench-results/ci-native
